name: nb_selfcare
description: "NB Selfcare — centro autónomo y 100% offline de autocuidado, biometría, nutrición e IA local."
publish_to: "none"
version: 0.1.0+1

# Toolchain fijado: Flutter 3.47.x (Dart 3.13.x). Ver .fvmrc y docs/11_ROADMAP.md (Fase 0).
environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

# ---------------------------------------------------------------------------
# Política de dependencias (docs/02_ARCHITECTURE.md §6):
#   * Solo se declaran aquí las dependencias de la fase en curso.
#   * Las de fases futuras están listadas (con versión verificada) en la
#     matriz de dependencias y se añaden con `flutter pub add` al iniciar la fase.
#   * PROHIBIDO: Firebase, analytics, crash reporters remotos, google_fonts
#     (descarga fuentes en runtime), flutter_blue_plus (licencia no OSI).
# ---------------------------------------------------------------------------

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Estado reactivo e inyección de dependencias
  flutter_riverpod: ^3.4.3
  riverpod_annotation: ^4.0.7

  # Persistencia local (SQLite empaquetado vía build hooks del paquete sqlite3, con FTS5)
  drift: ^2.35.2
  drift_flutter: ^0.3.1
  sqlite3: ^3.7.1
  path_provider: ^2.1.6
  path: ^1.9.0

  # UI: Material You + navegación
  dynamic_color: ^1.7.0
  go_router: ^18.1.1
  intl: any # versión fijada por flutter_localizations

  # Portabilidad total (.sqlite): exportar / importar
  file_picker: ^13.1.0
  share_plus: ^13.3.1
  universal_ble: ^3.1.2
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.16.2
  drift_dev: ^2.35.1
  riverpod_generator: ^4.0.9
  mocktail: ^1.0.5

flutter:
  uses-material-design: true
  generate: true

  # Fuentes empaquetadas (offline). Se añaden en Fase 1 (ver docs/07_ANDROID16_AND_NXTPAPER_UI.md §5).
  # fonts:
  #   - family: AtkinsonHyperlegibleNext
  #     fonts:
  #       - asset: assets/fonts/AtkinsonHyperlegibleNext-Regular.ttf
  #       - asset: assets/fonts/AtkinsonHyperlegibleNext-Medium.ttf
  #         weight: 500
  #       - asset: assets/fonts/AtkinsonHyperlegibleNext-Bold.ttf
  #         weight: 700

  # Semilla nutricional USDA en español (generada por tool/seed, Fase 1).
  # assets:
  #   - assets/seed/

