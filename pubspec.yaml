name: nb_selfcare
description: "NB Selfcare — autocuidado 100% offline: nutrición, cuerpo, ayuno, descanso y Nibi."
publish_to: "none"
version: 1.1.0+3

# Toolchain fijado: Flutter 3.47.x (Dart 3.13.x). Ver .fvmrc.
environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

# ---------------------------------------------------------------------------
# Política de dependencias (docs/02_ARCHITECTURE.md):
#   * PROHIBIDO: Firebase, analytics, crash reporters remotos, google_fonts
#     (descarga fuentes en runtime), flutter_blue_plus (licencia no OSI).
#   * Única red permitida: Open Food Facts (paquete http).
# ---------------------------------------------------------------------------

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Estado reactivo e inyección de dependencias
  flutter_riverpod: ^3.4.3

  # Persistencia local (SQLite empaquetado vía build hooks del paquete sqlite3, con FTS5)
  drift: ^2.35.2
  drift_flutter: ^0.3.1
  sqlite3: ^3.7.1
  path_provider: ^2.1.6
  path: ^1.9.0

  # UI: Material You + navegación
  dynamic_color: ^1.7.0
  go_router: ^18.1.1
  intl: any # versión fijada por flutter_localizations

  # Copias de seguridad (.sqlite): exportar / importar
  file_picker: ^13.1.0
  share_plus: ^13.3.1

  # Báscula Xiaomi Mi Scale 2 (Bluetooth LE)
  universal_ble: ^3.1.2

  # Open Food Facts (única llamada de red de la app)
  http: ^1.6.0

  # Escáner de códigos y lectura de etiquetas en el dispositivo (ML Kit, ADR-13)
  mobile_scanner: ^7.4.2
  image_picker: ^1.2.4
  google_mlkit_text_recognition: ^0.17.1

  # Informe en PDF para el profesional de salud
  pdf: ^3.13.1
  printing: ^5.15.1

  # Dictado de comidas, solo reconocimiento en el dispositivo
  speech_to_text: ^7.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.16.2
  drift_dev: ^2.35.1
  fake_async: ^1.3.3

flutter:
  uses-material-design: true
  generate: true

  fonts:
    - family: SpaceGrotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk.ttf
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope.ttf

  assets:
    - assets/images/

